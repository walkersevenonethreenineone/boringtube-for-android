<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BoringTube</title>

  <link rel="manifest" href="manifest.webmanifest">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    #home {
      width: min(680px, calc(100vw - 28px));
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 650;
    }

    p {
      margin: 0 0 18px;
      color: #999;
      line-height: 1.45;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1b1b1b;
      color: #eee;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #777; }
    button { font: inherit; }

    #watchButton {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 10px;
      background: #eee;
      color: #111;
      font-weight: 650;
      cursor: pointer;
    }

    #status {
      min-height: 24px;
      padding-top: 10px;
      color: #999;
      font-size: 14px;
    }

    #watch {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }

    #back {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 5;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: rgba(0,0,0,.55);
      color: #ddd;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      opacity: .28;
    }

    #back:active,
    #back:focus { opacity: 1; }
  </style>
</head>

<body>
  <main id="home">
    <h1>BoringTube</h1>
    <p>Вставь ссылку на то, что уже решил посмотреть.</p>

    <input
      id="url"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="https://youtu.be/..."
    >

    <button id="watchButton" type="button">Смотреть</button>
    <div id="status"></div>
  </main>

  <section id="watch">
    <button id="back" type="button" aria-label="Закрыть видео">←</button>

    <video
      id="player"
      controls
      playsinline
      preload="metadata"
      controlslist="nodownload">
    </video>
  </section>

  <script>
    /*
      После размещения backend замени адрес ниже, например:
      const BACKEND = "https://boringtube-backend.onrender.com";
    */
    const BACKEND = "https://boringtube.onrender.com";

    const input = document.getElementById("url");
    const status = document.getElementById("status");
    const home = document.getElementById("home");
    const watch = document.getElementById("watch");
    const player = document.getElementById("player");
    const back = document.getElementById("back");
    const watchButton = document.getElementById("watchButton");

    function setBusy(busy) {
      watchButton.disabled = busy;
      input.disabled = busy;
      watchButton.textContent = busy ? "Открываю..." : "Смотреть";
    }

    async function play() {
      const url = input.value.trim();

      if (!url) {
        status.textContent = "Вставь ссылку YouTube.";
        return;
      }

      setBusy(true);
      status.textContent = "Получаю чистый видеопоток...";

      try {
        const response = await fetch(BACKEND + "/api/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Не удалось открыть видео.");
        }

        player.src = BACKEND + data.stream;

        home.style.display = "none";
        watch.style.display = "block";
        document.body.style.display = "block";
        status.textContent = "";

        try {
          await player.play();
        } catch (_) {
          // Некоторые мобильные браузеры всё равно требуют нажать Play вручную.
        }

      } catch (error) {
        status.textContent = error.message || "Ошибка.";
      } finally {
        setBusy(false);
      }
    }

    function closeVideo() {
      player.pause();
      player.removeAttribute("src");
      player.load();

      watch.style.display = "none";
      home.style.display = "block";
      document.body.style.display = "grid";

      input.value = "";
      status.textContent = "";
      input.focus();
    }

    watchButton.addEventListener("click", play);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        play();
      }
    });

    back.addEventListener("click", closeVideo);

    player.addEventListener("error", () => {
      if (player.error) {
        alert("Поток не воспроизводится. Вернись назад и открой видео ещё раз.");
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
