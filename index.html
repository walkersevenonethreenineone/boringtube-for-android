<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">

  <title>BoringTube</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    #home {
      width: min(680px, calc(100vw - 28px));
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 650;
    }

    p {
      margin: 0 0 18px;
      color: #999;
      line-height: 1.45;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1b1b1b;
      color: #eee;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      font: inherit;
    }

    #watchButton {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 10px;
      background: #eee;
      color: #111;
      font-weight: 650;
      cursor: pointer;
    }

    #error {
      min-height: 24px;
      padding-top: 9px;
      color: #aaa;
      font-size: 14px;
    }

    #watch {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #back {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 5;

      width: 44px;
      height: 44px;

      border: 0;
      border-radius: 10px;

      background: rgba(0, 0, 0, 0.55);
      color: #ddd;

      font-size: 24px;
      line-height: 1;

      cursor: pointer;
      opacity: 0.35;
    }

    #back:active,
    #back:focus {
      opacity: 1;
    }
  </style>
</head>

<body>

  <main id="home">

    <h1>BoringTube</h1>

    <p>
      Вставь ссылку на то, что уже решил посмотреть.
    </p>

    <input
      id="url"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="https://youtu.be/..."
    >

    <button id="watchButton" type="button">
      Смотреть
    </button>

    <div id="error"></div>

  </main>


  <section id="watch">

    <button
      id="back"
      type="button"
      aria-label="Закрыть видео"
    >
      ←
    </button>

    <iframe
      id="player"
      title="YouTube video player"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share
      "
      allowfullscreen>
    </iframe>

  </section>


  <script>

    const input =
      document.getElementById("url");

    const error =
      document.getElementById("error");

    const home =
      document.getElementById("home");

    const watch =
      document.getElementById("watch");

    const player =
      document.getElementById("player");

    const back =
      document.getElementById("back");

    const watchButton =
      document.getElementById("watchButton");


    function getVideoId(raw) {

      const value = raw.trim();

      if (/^[A-Za-z0-9_-]{11}$/.test(value)) {
        return value;
      }

      try {

        const u = new URL(value);

        const host =
          u.hostname.replace(/^www\./, "");


        if (host === "youtu.be") {

          return (
            u.pathname
              .split("/")
              .filter(Boolean)[0]
            || null
          );

        }


        if (
          host === "youtube.com" ||
          host === "m.youtube.com" ||
          host === "music.youtube.com" ||
          host === "youtube-nocookie.com"
        ) {

          if (u.pathname === "/watch") {
            return u.searchParams.get("v");
          }


          const parts =
            u.pathname
              .split("/")
              .filter(Boolean);


          if (
            ["shorts", "embed", "live"]
              .includes(parts[0])
          ) {

            return parts[1] || null;

          }

        }

      } catch (_) {}


      return null;

    }


    function play() {

      const id =
        getVideoId(input.value);


      if (!id) {

        error.textContent =
          "Не удалось распознать ссылку YouTube.";

        return;

      }


      error.textContent = "";


      player.src =
        "https://www.youtube-nocookie.com/embed/"
        + encodeURIComponent(id)
        + "?autoplay=1&playsinline=1&rel=0";


      home.style.display = "none";

      watch.style.display = "block";

      document.body.style.display = "block";

    }


    function closeVideo() {

      player.src = "";

      watch.style.display = "none";

      home.style.display = "block";

      document.body.style.display = "grid";

      input.value = "";

      input.focus();

    }


    watchButton.addEventListener(
      "click",
      play
    );


    input.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          event.preventDefault();

          play();

        }

      }
    );


    back.addEventListener(
      "click",
      closeVideo
    );


    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(() => {});

        }
      );

    }

  </script>

</body>
</html>
